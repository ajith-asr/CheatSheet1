<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Deck — React Cheat Sheet for HTML · CSS · JS · Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070B14;
  --deep:#0C1221;
  --glass:rgba(22,30,48,.72);
  --glass-2:rgba(30,40,62,.6);
  --edge:rgba(120,140,190,.16);
  --edge-hi:rgba(120,140,190,.32);
  --text:#EAF0FF;
  --muted:#93A0BF;
  --faint:#5D6A88;
  --r:16px;
  --display:"Space Grotesk",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-lang="html"]  {--a:#FF7A45;--a2:#FFB199;--ink:#2A0F04;--glow:rgba(255,122,69,.30)}
[data-lang="css"]   {--a:#5AA9FF;--a2:#9BD0FF;--ink:#04162C;--glow:rgba(90,169,255,.30)}
[data-lang="js"]    {--a:#FFD84D;--a2:#FFEFA8;--ink:#2A2104;--glow:rgba(255,216,77,.28)}
[data-lang="python"]{--a:#46E39B;--a2:#A6F5CE;--ink:#03210F;--glow:rgba(70,227,155,.28)}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--void);color:var(--text);font-family:var(--display);
  line-height:1.55;min-height:100vh;overflow-x:hidden;
}
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;
  transition:background 1.1s var(--ease);
  animation:drift 26s ease-in-out infinite;
}
.blob.b1{width:52vw;height:52vw;top:-18vw;right:-12vw;background:var(--glow)}
.blob.b2{width:40vw;height:40vw;bottom:-14vw;left:-10vw;background:var(--glow);animation-delay:-9s;opacity:.4}
.blob.b3{width:30vw;height:30vw;top:38%;left:44%;background:var(--glow);animation-delay:-16s;opacity:.22}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(4vw,-3vw) scale(1.12)}
  66%{transform:translate(-3vw,4vw) scale(.92)}
}
#grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(var(--edge) 1px,transparent 1px),linear-gradient(90deg,var(--edge) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 78%);
}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:262px 1fr;gap:26px;
  max-width:1420px;margin:0 auto;padding:26px 24px 120px}

/* ---------- sidebar ---------- */
.side{position:sticky;top:26px;align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 52px);overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:4px 2px 2px}
.brand .mark{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--a),var(--a2));color:var(--ink);
  font-family:var(--mono);font-weight:600;font-size:.82rem;
  box-shadow:0 8px 22px var(--glow);transition:background .6s var(--ease),box-shadow .6s
}
.brand h1{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand span{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}

.panel{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);backdrop-filter:blur(14px)}
.langs{padding:8px;display:flex;flex-direction:column;gap:4px;position:relative}
.lang-btn{
  appearance:none;background:none;border:0;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  font-family:var(--display);font-weight:600;font-size:.92rem;text-align:left;
  transition:color .25s,background .25s;position:relative;z-index:1
}
.lang-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.lang-btn.on{color:var(--ink)}
.lang-btn:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.lang-btn .tag{font-family:var(--mono);font-size:.7rem;opacity:.9;width:34px;flex:none}
.lang-btn .pct{margin-left:auto;font-family:var(--mono);font-size:.68rem;opacity:.75}
.slider{
  position:absolute;left:8px;right:8px;height:40px;border-radius:11px;z-index:0;
  background:linear-gradient(120deg,var(--a),var(--a2));
  box-shadow:0 6px 20px var(--glow);
  transition:transform .42s var(--ease),background .5s var(--ease)
}

.rings{padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ring-label{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ring-wrap{position:relative;width:150px;height:150px}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-center .big{font-size:1.7rem;font-weight:700;line-height:1;color:var(--a);transition:color .5s}
.ring-center .small{font-family:var(--mono);font-size:.6rem;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.ring-track{stroke:rgba(255,255,255,.07)}
.ring-arc{transition:stroke-dashoffset .9s var(--ease),stroke .5s;filter:drop-shadow(0 0 6px var(--glow))}

.stats{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--glass-2);border:1px solid var(--edge);border-radius:11px;padding:9px 10px}
.stat .n{font-size:1.15rem;font-weight:700;font-family:var(--mono);color:var(--a);transition:color .5s}
.stat .l{font-size:.62rem;font-family:var(--mono);color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.side-note{font-family:var(--mono);font-size:.62rem;color:var(--faint);padding:0 4px;line-height:1.6}
.reset-link{appearance:none;background:none;border:0;color:var(--faint);font-family:var(--mono);
  font-size:.62rem;cursor:pointer;text-decoration:underline dotted;padding:0}
.reset-link:hover{color:var(--a)}

/* ---------- main ---------- */
.head{margin-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--a);display:flex;align-items:center;gap:10px;transition:color .5s}
.eyebrow::after{content:"";height:1px;flex:1;max-width:120px;background:linear-gradient(90deg,var(--a),transparent)}
.title{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:700;letter-spacing:-.025em;margin:8px 0 6px;line-height:1.05}
.title em{font-style:normal;color:var(--a);transition:color .5s}
.title .cursor{display:inline-block;width:3px;height:.85em;background:var(--a);vertical-align:-2px;
  margin-left:3px;animation:blink 1.05s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lede{color:var(--muted);max-width:620px;font-size:.94rem}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.find{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;padding:11px 15px;
  background:var(--glass);border:1px solid var(--edge);border-radius:13px;backdrop-filter:blur(12px);
  transition:border-color .25s,box-shadow .25s}
.find:focus-within{border-color:var(--a);box-shadow:0 0 0 4px var(--glow)}
.find input{flex:1;background:none;border:0;outline:0;color:var(--text);font-family:var(--mono);font-size:.86rem;min-width:0}
.find input::placeholder{color:var(--faint)}
.find kbd{font-family:var(--mono);font-size:.64rem;color:var(--faint);border:1px solid var(--edge);border-radius:6px;padding:2px 6px}
.btn{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--edge);color:var(--muted);
  font-family:var(--mono);font-size:.72rem;padding:11px 14px;border-radius:13px;
  transition:color .2s,border-color .2s,transform .2s;backdrop-filter:blur(12px)}
.btn:hover{color:var(--text);border-color:var(--a);transform:translateY(-1px)}
.btn:focus-visible,.find:focus-within{outline:none}
.btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hits{font-family:var(--mono);font-size:.7rem;color:var(--a);min-height:1em;margin-bottom:12px;transition:color .5s}

/* ---------- sections ---------- */
.sec{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:11px;
  overflow:hidden;backdrop-filter:blur(14px);scroll-margin-top:20px;
  animation:secIn .5s var(--ease) both}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec-head{width:100%;appearance:none;background:none;border:0;cursor:pointer;color:var(--text);
  display:flex;align-items:center;gap:13px;padding:15px 17px;text-align:left;font-family:var(--display)}
.sec-head:hover{background:rgba(255,255,255,.03)}
.sec-head:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.sec-num{font-family:var(--mono);font-size:.72rem;color:var(--a);opacity:.85;width:22px;flex:none;transition:color .5s}
.sec-name{font-weight:600;font-size:1rem;flex:1;letter-spacing:-.01em}
.mini-bar{width:52px;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;flex:none}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:99px;
  transition:width .7s var(--ease),background .5s}
.sec-n{font-family:var(--mono);font-size:.66rem;color:var(--faint);width:46px;text-align:right;flex:none}
.caret{color:var(--faint);transition:transform .35s var(--ease);flex:none}
.sec.open .caret{transform:rotate(180deg)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-inner{overflow:hidden}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px;padding:2px 13px 15px}

.card{background:var(--glass-2);border:1px solid var(--edge);border-radius:12px;padding:11px 12px 10px;
  position:relative;transition:transform .22s var(--ease),border-color .22s,box-shadow .22s;
  animation:cardIn .42s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);border-color:var(--a);box-shadow:0 12px 26px rgba(0,0,0,.35),0 0 0 1px var(--glow)}
.card.done{border-color:var(--a);background:linear-gradient(180deg,var(--glow),transparent 55%),var(--glass-2)}
.card code{display:block;font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--text);
  white-space:pre-wrap;word-break:break-word;padding-right:52px}
.card .txt{display:block;font-size:.79rem;color:var(--muted);margin-top:4px}
.card mark{background:var(--a);color:var(--ink);border-radius:3px;padding:0 2px}
.card .txt mark{background:var(--glow);color:var(--a2)}
.tools{position:absolute;top:8px;right:9px;display:flex;gap:5px;opacity:0;transition:opacity .2s}
.card:hover .tools,.card.done .tools,.tools:focus-within{opacity:1}
.tbtn{appearance:none;cursor:pointer;background:rgba(0,0,0,.35);border:1px solid var(--edge);
  color:var(--muted);font-family:var(--mono);font-size:.6rem;border-radius:7px;padding:3px 7px;
  transition:color .18s,border-color .18s,background .18s}
.tbtn:hover{color:var(--a);border-color:var(--a)}
.tbtn:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.tbtn.on{background:var(--a);color:var(--ink);border-color:transparent;font-weight:600}
.pop{position:absolute;inset:0;border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 2px var(--a);opacity:0}
.card.flash .pop{animation:pop .55s var(--ease)}
@keyframes pop{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.035)}}

.void{text-align:center;padding:70px 20px;font-family:var(--mono);font-size:.84rem;color:var(--muted)}
.void b{color:var(--a)}

/* ---------- playground ---------- */
.dock{position:fixed;bottom:22px;right:22px;z-index:60;appearance:none;border:0;cursor:pointer;
  background:linear-gradient(120deg,var(--a),var(--a2));color:var(--ink);font-family:var(--display);
  font-weight:700;font-size:.9rem;padding:13px 22px;border-radius:99px;display:flex;gap:9px;align-items:center;
  box-shadow:0 14px 34px var(--glow);transition:transform .25s var(--ease),background .5s}
.dock:hover{transform:translateY(-3px) scale(1.03)}
.dock:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.pgwrap{position:fixed;left:0;right:0;bottom:0;z-index:58;height:min(50vh,460px);
  background:rgba(8,12,22,.94);backdrop-filter:blur(18px);border-top:1px solid var(--edge-hi);
  display:flex;flex-direction:column;transform:translateY(103%);
  transition:transform .42s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.pgwrap.up{transform:none}
.pgbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.pgtag{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--a);transition:color .5s}
.pgt{appearance:none;cursor:pointer;background:var(--glass-2);border:1px solid var(--edge);color:var(--muted);
  font-family:var(--mono);font-size:.71rem;padding:7px 13px;border-radius:99px;transition:all .22s}
.pgt:hover{color:var(--text)}
.pgt.on{background:linear-gradient(120deg,var(--a),var(--a2));color:var(--ink);border-color:transparent;font-weight:600}
.pgt:focus-visible,.run:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.grow{flex:1}
.run{appearance:none;cursor:pointer;border:0;border-radius:99px;font-family:var(--display);font-weight:700;
  font-size:.83rem;padding:8px 18px;background:linear-gradient(120deg,var(--a),var(--a2));color:var(--ink);
  display:flex;gap:8px;align-items:center;transition:transform .2s,background .5s}
.run:hover{transform:translateY(-1px)}
.run:disabled{opacity:.6;cursor:wait}
.run small{font-family:var(--mono);font-size:.6rem;opacity:.7}
.pgbody{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.ed{width:100%;height:100%;resize:none;border:0;outline:0;background:rgba(0,0,0,.28);color:var(--text);
  font-family:var(--mono);font-size:.81rem;line-height:1.65;padding:14px 16px;tab-size:4}
.outwrap{position:relative;border-left:1px solid var(--edge);min-height:0;background:rgba(0,0,0,.16)}
.out{position:absolute;inset:0;overflow:auto;padding:12px 15px;font-family:var(--mono);font-size:.77rem;line-height:1.6}
.out .ln{white-space:pre-wrap;word-break:break-word;animation:lnIn .25s var(--ease) both}
@keyframes lnIn{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
.out .e{color:#FF8A8A}
.out .r{color:var(--a)}
.out .d{color:var(--faint);font-style:italic}
.out .empty{color:var(--faint);font-style:italic}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--ink);border-right-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);z-index:70;
  background:linear-gradient(120deg,var(--a),var(--a2));color:var(--ink);font-weight:700;font-size:.84rem;
  padding:10px 20px;border-radius:99px;transition:transform .35s var(--ease);pointer-events:none;
  box-shadow:0 10px 28px var(--glow)}
.toast.up{transform:translate(-50%,0)}

@media (max-width:980px){
  .shell{grid-template-columns:1fr;padding:18px 16px 110px;gap:16px}
  .side{position:static;max-height:none;flex-direction:column}
  .langs{flex-direction:row;overflow-x:auto}
  .lang-btn{flex:none}
  .slider{display:none}
  .lang-btn.on{background:linear-gradient(120deg,var(--a),var(--a2))}
  .rings,.stats{display:none}
  .cards{grid-template-columns:1fr}
  .pgbody{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .outwrap{border-left:0;border-top:1px solid var(--edge)}
  .pgwrap{height:min(68vh,560px)}
  .run small{display:none}
}
@media (hover:none){
  .tools{position:static;opacity:1;margin-top:9px;justify-content:flex-end}
  .card code{padding-right:0}
  .tbtn{padding:5px 10px;font-size:.64rem}
}
@media (max-width:980px){ .side-note{display:none} }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================
   1. CONSTANTS
   ============================================================ */
const LANGS = [
  { id:"html",   name:"HTML",       tag:"</>",  mode:"web" },
  { id:"css",    name:"CSS",        tag:"{ }",  mode:"web" },
  { id:"js",     name:"JavaScript", tag:"( )",  mode:"js"  },
  { id:"python", name:"Python",     tag:">>>",  mode:"py"  },
];

const LEDE = {
  html:   "Structure the page. Tags, attributes, forms and semantics — the skeleton every site is built on.",
  css:    "Style the page. Selectors, the box model, flexbox, grid, and animation that makes it feel alive.",
  js:     "Make it think. Logic, the DOM, events, async and everything that turns a page into an app.",
  python: "Think in code. Clean syntax for scripts, data, automation and backends — readable by design.",
};

const SAMPLES = {
  js: `// Press Run (or Ctrl+Enter)\nconst nums = [1, 2, 3, 4, 5];\n\nconsole.log("Doubled:", nums.map(n => n * 2));\nconsole.log("Evens:", nums.filter(n => n % 2 === 0));\nconsole.log("Total:", nums.reduce((s, n) => s + n, 0));`,
  py: `# Press Run (or Ctrl+Enter)\nnums = [1, 2, 3, 4, 5]\n\nprint("Doubled:", [n * 2 for n in nums])\nprint("Evens:", [n for n in nums if n % 2 == 0])\nprint("Total:", sum(nums))`,
  web: `<style>\n  body { font-family: system-ui; display: grid; place-items: center; height: 92vh; margin: 0;\n         background: #0d1117; }\n  .card {\n    padding: 26px 36px; border-radius: 18px; color: #fff; text-align: center;\n    background: linear-gradient(135deg, #7c5cff, #ff5ca8);\n    box-shadow: 0 18px 44px rgba(124,92,255,.4);\n    animation: float 3s ease-in-out infinite;\n  }\n  @keyframes float { 50% { transform: translateY(-12px) } }\n</style>\n\n<div class="card">\n  <h2>Edit me, then Run 🎨</h2>\n  <p>HTML + CSS render live here.</p>\n</div>`,
};

const STORE_KEY = "codexdeck.progress.v1";
const loadProgress = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } };
const saveProgress = p => { try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch {} };

/* ============================================================
   2. SMALL HOOKS
   ============================================================ */
function useCountUp(target, ms = 700){
  const [n, setN] = useState(target);
  const from = useRef(target);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { setN(target); return; }
    const start = performance.now(), a = from.current, b = target;
    let raf;
    const tick = t => {
      const p = Math.min(1, (t - start) / ms);
      setN(Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(tick); else from.current = b;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, ms]);
  return n;
}

function useTypedTitle(text){
  const [shown, setShown] = useState(text);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { setShown(text); return; }
    setShown("");
    let i = 0;
    const id = setInterval(() => {
      i++; setShown(text.slice(0, i));
      if (i >= text.length) clearInterval(id);
    }, 55);
    return () => clearInterval(id);
  }, [text]);
  return shown;
}

/* ============================================================
   3. VISUAL COMPONENTS
   ============================================================ */
function ProgressRing({ done, total }){
  const pct = total ? done / total : 0;
  const shown = useCountUp(Math.round(pct * 100));
  const R = 62, C = 2 * Math.PI * R;
  return (
    <div className="ring-wrap">
      <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
        <circle className="ring-track" cx="75" cy="75" r={R} fill="none" strokeWidth="9"/>
        <circle className="ring-arc" cx="75" cy="75" r={R} fill="none" strokeWidth="9"
          stroke="var(--a)" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C * (1 - pct)}
          transform="rotate(-90 75 75)"/>
      </svg>
      <div className="ring-center">
        <div>
          <div className="big">{shown}%</div>
          <div className="small">{done} / {total}</div>
        </div>
      </div>
    </div>
  );
}

function Stat({ n, label }){
  const v = useCountUp(n);
  return <div className="stat"><div className="n">{v}</div><div className="l">{label}</div></div>;
}

function Highlight({ text, q }){
  if (!q) return <>{text}</>;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return <>{text}</>;
  return <>{text.slice(0, i)}<mark>{text.slice(i, i + q.length)}</mark>{text.slice(i + q.length)}</>;
}

/* ============================================================
   4. CARD + SECTION
   ============================================================ */
function Card({ syntax, desc, q, index, done, onToggle, onCopy, onSend }){
  const [flash, setFlash] = useState(false);
  const fire = () => { setFlash(true); setTimeout(() => setFlash(false), 560); };
  return (
    <div className={"card" + (done ? " done" : "") + (flash ? " flash" : "")}
         style={{ animationDelay: Math.min(index * 22, 320) + "ms" }}>
      <span className="pop"></span>
      <code><Highlight text={syntax} q={q}/></code>
      <span className="txt"><Highlight text={desc} q={q}/></span>
      <div className="tools">
        <button className="tbtn" title="Send to playground" onClick={() => { onSend(syntax); fire(); }}>run</button>
        <button className="tbtn" title="Copy syntax" onClick={() => { onCopy(syntax); fire(); }}>copy</button>
        <button className={"tbtn" + (done ? " on" : "")} title="Mark as learned"
                aria-pressed={done} onClick={onToggle}>{done ? "✓ learned" : "learn"}</button>
      </div>
    </div>
  );
}

function Section({ sec, idx, q, open, onToggle, progress, mark, onCopy, onSend, langId }){
  const items = useMemo(() => {
    if (!q) return sec.items.map((it, i) => ({ it, i }));
    const titleHit = sec.t.toLowerCase().includes(q);
    return sec.items.map((it, i) => ({ it, i }))
      .filter(({ it }) => titleHit || it[0].toLowerCase().includes(q) || it[1].toLowerCase().includes(q));
  }, [sec, q]);

  const doneCount = sec.items.reduce((n, _, i) => n + (progress[langId + ":" + idx + ":" + i] ? 1 : 0), 0);
  const pct = Math.round((doneCount / sec.items.length) * 100);
  if (q && items.length === 0) return null;

  return (
    <section className={"sec" + (open ? " open" : "")} id={"s" + idx}
             style={{ animationDelay: Math.min(idx * 35, 400) + "ms" }}>
      <button className="sec-head" onClick={onToggle} aria-expanded={open}>
        <span className="sec-num">{String(idx + 1).padStart(2, "0")}</span>
        <span className="sec-name">{sec.t}</span>
        <span className="mini-bar" title={pct + "% learned"}>
          <span className="mini-fill" style={{ width: pct + "%" }}></span>
        </span>
        <span className="sec-n">{q ? items.length + "/" : ""}{sec.items.length}</span>
        <span className="caret">▾</span>
      </button>
      <div className="sec-body">
        <div className="sec-inner">
          <div className="cards">
            {open && items.map(({ it, i }, n) => {
              const key = langId + ":" + idx + ":" + i;
              return <Card key={key} syntax={it[0]} desc={it[1]} q={q} index={n}
                           done={!!progress[key]} onToggle={() => mark(key)}
                           onCopy={onCopy} onSend={onSend}/>;
            })}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   5. PLAYGROUND
   ============================================================ */
function Playground({ up, onClose, mode, setMode, injectRef, onToast }){
  const [code, setCode] = useState(SAMPLES[mode]);
  const [lines, setLines] = useState([]);
  const [busy, setBusy] = useState(false);
  const [srcDoc, setSrcDoc] = useState("");
  const buffers = useRef({ ...SAMPLES });
  const edRef = useRef(null);
  const outRef = useRef(null);
  const pyRef = useRef(null);
  const pyLoad = useRef(null);

  const push = useCallback((text, cls) => {
    setLines(l => [...l.slice(-300), { text, cls, id: Math.random().toString(36).slice(2) }]);
  }, []);

  useEffect(() => { if (outRef.current) outRef.current.scrollTop = outRef.current.scrollHeight; }, [lines]);

  // keep a live ref of the editor text so buffer swaps never lose work
  const codeRef = useRef(code);
  useEffect(() => { codeRef.current = code; }, [code]);

  // whenever the mode changes — from these tabs OR from outside — swap buffers
  const lastMode = useRef(mode);
  useEffect(() => {
    if (lastMode.current === mode) return;
    buffers.current[lastMode.current] = codeRef.current;
    setCode(buffers.current[mode]);
    lastMode.current = mode;
  }, [mode]);

  const switchMode = m => setMode(m);

  // let the outside world drop a snippet into the editor
  injectRef.current = (snippet, wantMode) => {
    buffers.current[mode] = codeRef.current;
    const target = wantMode || mode;
    const base = (target === mode ? codeRef.current : buffers.current[target]) || "";
    const next = (base.trimEnd() ? base.trimEnd() + "\n" : "") + snippet + "\n";
    buffers.current[target] = next;
    if (target === mode) { setCode(next); lastMode.current = target; }
    else setMode(target);   // the sync effect loads buffers.current[target]
    setTimeout(() => {
      const el = edRef.current;
      if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; el.scrollTop = el.scrollHeight; }
    }, 60);
  };

  const fmt = v => {
    if (typeof v === "string") return v;
    if (typeof v === "function") return String(v);
    try { return JSON.stringify(v) ?? String(v); } catch { return String(v); }
  };

  const runJS = src => {
    const orig = { log: console.log, warn: console.warn, error: console.error, info: console.info };
    const hook = cls => (...a) => { push(a.map(fmt).join(" "), cls); orig.log(...a); };
    console.log = hook(); console.info = hook(); console.warn = hook(); console.error = hook("e");
    try {
      const out = new Function(src)();
      if (out !== undefined) push("→ " + fmt(out), "r");
    } catch (err) { push("✗ " + err, "e"); }
    finally { Object.assign(console, orig); }
  };

  const loadScript = src => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src));
    document.head.appendChild(s);
  });

  const ensurePy = () => {
    if (pyRef.current) return Promise.resolve(pyRef.current);
    if (!pyLoad.current) {
      push("Booting Python runtime… first run only (~10 MB, needs internet)", "d");
      pyLoad.current = loadScript("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js")
        .then(() => loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" }))
        .then(py => { pyRef.current = py; push("Python ready ✓", "d"); return py; })
        .catch(e => {
          pyLoad.current = null;
          push("Python runtime unavailable — check your connection, then press Run again.", "d");
          throw e;
        });
    }
    return pyLoad.current;
  };

  const runPy = async src => {
    setBusy(true);
    try {
      const py = await ensurePy();
      py.setStdout({ batched: s => push(s) });
      py.setStderr({ batched: s => push(s, "e") });
      const out = await py.runPythonAsync(src);
      if (out !== undefined && out !== null) push("→ " + String(out), "r");
    } catch (e) {
      const msg = String(e && e.message ? e.message : e).trim().split("\n");
      push("✗ " + msg.slice(-3).join("\n"), "e");
    } finally { setBusy(false); }
  };

  const run = () => {
    buffers.current[mode] = codeRef.current;
    if (mode === "web") { setSrcDoc(code); return; }
    push("── run " + new Date().toLocaleTimeString() + " ──", "d");
    mode === "js" ? runJS(code) : runPy(code);
  };

  const onKey = e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const el = e.target, s = el.selectionStart, en = el.selectionEnd;
      const next = code.slice(0, s) + "    " + code.slice(en);
      setCode(next);
      setTimeout(() => { el.selectionStart = el.selectionEnd = s + 4; }, 0);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  };

  return (
    <section className={"pgwrap" + (up ? " up" : "")} aria-label="Code playground">
      <div className="pgbar">
        <span className="pgtag">Playground</span>
        {[["js","JavaScript"],["py","Python"],["web","HTML + CSS"]].map(([m, label]) =>
          <button key={m} className={"pgt" + (mode === m ? " on" : "")}
                  onClick={() => switchMode(m)}>{label}</button>)}
        <span className="grow"></span>
        <button className="pgt" onClick={() => { buffers.current[mode] = SAMPLES[mode]; setCode(SAMPLES[mode]); }}>reset code</button>
        <button className="pgt" onClick={() => { setLines([]); setSrcDoc(""); }}>clear output</button>
        <button className="run" onClick={run} disabled={busy}>
          {busy ? <><span className="spin"></span> running</> : <>▶ Run <small>Ctrl+↵</small></>}
        </button>
        <button className="pgt" onClick={onClose} aria-label="Close playground">✕</button>
      </div>
      <div className="pgbody">
        <textarea ref={edRef} className="ed" spellCheck="false" value={code}
                  onChange={e => setCode(e.target.value)} onKeyDown={onKey} aria-label="Code editor"/>
        <div className="outwrap">
          {mode === "web"
            ? <iframe className="frame" title="Live preview" sandbox="allow-scripts" srcDoc={srcDoc}/>
            : <div className="out" ref={outRef} aria-live="polite">
                {lines.length === 0
                  ? <div className="empty">Output appears here — press ▶ Run</div>
                  : lines.map(l => <div key={l.id} className={"ln " + (l.cls || "")}>{l.text}</div>)}
              </div>}
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   6. APP
   ============================================================ */
function App(){
  const [lang, setLang] = useState("html");
  const [q, setQ] = useState("");
  const [openSecs, setOpenSecs] = useState({ 0: true });
  const [progress, setProgress] = useState(loadProgress);
  const [pgUp, setPgUp] = useState(false);
  const [pgMode, setPgMode] = useState("js");
  const [toast, setToast] = useState("");
  const injectRef = useRef(() => {});
  const searchRef = useRef(null);
  const toastTimer = useRef(null);

  const data = DATA[lang];
  const langMeta = LANGS.find(l => l.id === lang);
  const query = q.trim().toLowerCase();
  const typed = useTypedTitle(data.word);

  useEffect(() => { document.body.dataset.lang = lang; }, [lang]);
  useEffect(() => { saveProgress(progress); }, [progress]);

  const showToast = msg => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 1600);
  };

  /* stats */
  const totals = useMemo(() => {
    const all = {};
    Object.keys(DATA).forEach(k => {
      const total = DATA[k].sections.reduce((n, s) => n + s.items.length, 0);
      let done = 0;
      DATA[k].sections.forEach((s, si) => s.items.forEach((_, ii) => {
        if (progress[k + ":" + si + ":" + ii]) done++;
      }));
      all[k] = { total, done };
    });
    return all;
  }, [progress]);

  const hits = useMemo(() => {
    if (!query) return null;
    let n = 0;
    data.sections.forEach(s => {
      const titleHit = s.t.toLowerCase().includes(query);
      s.items.forEach(it => {
        if (titleHit || it[0].toLowerCase().includes(query) || it[1].toLowerCase().includes(query)) n++;
      });
    });
    return n;
  }, [query, data]);

  /* when searching, open every section that still has matches */
  useEffect(() => {
    if (query) {
      const next = {};
      data.sections.forEach((s, i) => { next[i] = true; });
      setOpenSecs(next);
    }
  }, [query, lang, data]);

  const changeLang = id => {
    setLang(id);
    setOpenSecs({ 0: true });
    const m = LANGS.find(l => l.id === id).mode;
    if (pgUp) setPgMode(m);
  };

  const copy = text => {
    const done = () => showToast("Copied to clipboard");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else done();
  };

  const sendToPlayground = snippet => {
    setPgUp(true);
    const target = langMeta.mode;
    setTimeout(() => injectRef.current(snippet, target), 30);
    showToast("Added to playground ▸ press Run");
  };

  const mark = key => setProgress(p => {
    const next = { ...p };
    if (next[key]) delete next[key]; else next[key] = 1;
    return next;
  });

  /* keyboard shortcuts */
  useEffect(() => {
    const onKey = e => {
      const typing = ["INPUT","TEXTAREA"].includes(document.activeElement.tagName);
      if (e.key === "/" && !typing) { e.preventDefault(); searchRef.current?.focus(); }
      if (e.key === "Escape") {
        if (document.activeElement === searchRef.current) { setQ(""); searchRef.current.blur(); }
        else if (pgUp && !typing) setPgUp(false);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [pgUp]);

  const cur = totals[lang];
  const grand = Object.values(totals).reduce((a, t) => ({ done: a.done + t.done, total: a.total + t.total }), { done:0, total:0 });

  return (
    <>
      <div className="shell">
        {/* ---------------- sidebar ---------------- */}
        <aside className="side">
          <div className="brand">
            <span className="mark">{langMeta.tag}</span>
            <h1>Codex Deck<span>Interactive reference</span></h1>
          </div>

          <nav className="panel langs" aria-label="Language">
            <span className="slider" style={{ transform: "translateY(" + LANGS.findIndex(l => l.id === lang) * 44 + "px)" }}></span>
            {LANGS.map(l => {
              const t = totals[l.id];
              return (
                <button key={l.id} className={"lang-btn" + (lang === l.id ? " on" : "")}
                        onClick={() => changeLang(l.id)} aria-current={lang === l.id}>
                  <span className="tag">{l.tag}</span>{l.name}
                  <span className="pct">{Math.round((t.done / t.total) * 100)}%</span>
                </button>
              );
            })}
          </nav>

          <div className="panel rings">
            <span className="ring-label">{langMeta.name} mastery</span>
            <ProgressRing done={cur.done} total={cur.total}/>
          </div>

          <div className="panel stats">
            <Stat n={data.sections.length} label="sections"/>
            <Stat n={cur.total} label="entries"/>
            <Stat n={grand.done} label="learned"/>
            <Stat n={grand.total} label="all cards"/>
          </div>

          <p className="side-note">
            Mark cards <b>learned</b> to fill the ring. Progress is saved in this browser.{" "}
            <button className="reset-link" onClick={() => { if (confirm("Clear all learned marks?")) setProgress({}); }}>reset progress</button>
          </p>
        </aside>

        {/* ---------------- main ---------------- */}
        <main>
          <header className="head">
            <div className="eyebrow">MDN + Python reference · 636 entries</div>
            <h2 className="title">Learn <em>{typed}</em><span className="cursor"></span></h2>
            <p className="lede">{LEDE[lang]}</p>
          </header>

          <div className="bar">
            <label className="find">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2.4" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
              </svg>
              <input ref={searchRef} type="search" value={q} onChange={e => setQ(e.target.value)}
                     placeholder="Search syntax or description…" aria-label="Search"/>
              <kbd>/</kbd>
            </label>
            <button className="btn" onClick={() => {
              const all = {}; data.sections.forEach((_, i) => all[i] = true); setOpenSecs(all);
            }}>expand all</button>
            <button className="btn" onClick={() => setOpenSecs({})}>collapse all</button>
          </div>

          <div className="hits">
            {query ? hits + " result" + (hits === 1 ? "" : "s") + " for “" + q.trim() + "”" : ""}
          </div>

          {query && hits === 0
            ? <div className="void">Nothing matches <b>{q.trim()}</b> — try a shorter keyword.</div>
            : data.sections.map((sec, i) => (
                <Section key={lang + i} sec={sec} idx={i} q={query} langId={lang}
                         open={!!openSecs[i]} progress={progress} mark={mark}
                         onToggle={() => setOpenSecs(o => ({ ...o, [i]: !o[i] }))}
                         onCopy={copy} onSend={sendToPlayground}/>
              ))}
        </main>
      </div>

      {!pgUp && <button className="dock" onClick={() => { setPgMode(langMeta.mode); setPgUp(true); }}>▶ Playground</button>}
      <Playground up={pgUp} onClose={() => setPgUp(false)} mode={pgMode} setMode={setPgMode}
                  injectRef={injectRef} onToast={showToast}/>
      <div className={"toast" + (toast ? " up" : "")}>{toast || " "}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
